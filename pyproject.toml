[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-relay-cli"
version = "0.2.0"
description = "Hand unfinished coding work to a collaborator's agent, through GitHub."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "PittsIrv"}]
dependencies = []
keywords = ["coding agents", "claude code", "codex", "github", "handoff", "collaboration"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Operating System :: POSIX", "Topic :: Software Development", "Environment :: Console", "License :: OSI Approved :: Apache Software License"]

[project.urls]
Repository = "https://github.com/PittsIrv/agent-relay"
Issues = "https://github.com/PittsIrv/agent-relay/issues"

[project.scripts]
relay = "agent_relay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
